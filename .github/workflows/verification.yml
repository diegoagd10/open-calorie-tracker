name: Fast verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests, architecture, and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p reports/ci
      - name: Run the local fast gate
        run: pnpm verify 2>&1 | tee reports/ci/fast-verification.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fast-verification-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: reports/ci/fast-verification.log
          if-no-files-found: warn
          retention-days: 14
