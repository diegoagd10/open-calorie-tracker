name: Deep verification

on:
  schedule:
    - cron: "29 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Coverage, architecture, browser, properties, mutation, and security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: mkdir -p reports/ci
      - name: Run the local deep gate
        run: pnpm verify:deep 2>&1 | tee reports/ci/deep-verification.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deep-verification-${{ github.run_id }}
          path: |
            coverage/
            playwright-report/
            test-results/
            reports/
          if-no-files-found: warn
          retention-days: 14
