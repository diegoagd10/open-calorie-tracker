name: Deployment tests

on:
  pull_request:
    paths:
      - ".github/workflows/deployment.yml"
      - ".dockerignore"
      - "*.config.*"
      - "Dockerfile"
      - "app/**"
      - "docker-compose.yml"
      - "drizzle/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "public/**"
      - "server.js"
      - "server/**"
      - "scripts/**"
      - "tests/deployment.container.test.ts"
      - "tests/support/deployment.ts"
      - "tsconfig*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deployment.yml"
      - ".dockerignore"
      - "*.config.*"
      - "Dockerfile"
      - "app/**"
      - "docker-compose.yml"
      - "drizzle/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "public/**"
      - "server.js"
      - "server/**"
      - "scripts/**"
      - "tests/deployment.container.test.ts"
      - "tests/support/deployment.ts"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: Production container and Compose contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p reports/ci
      - name: Test the production container
        run: pnpm test:deployment 2>&1 | tee reports/ci/deployment.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deployment-${{ github.run_id }}
          path: reports/ci/deployment.log
          if-no-files-found: warn
          retention-days: 14
