name: Mutation testing

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Reject mutation score regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation:policy
      - run: pnpm mutation:test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 14
