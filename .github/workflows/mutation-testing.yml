name: Mutation testing

on:
  pull_request:
    paths:
      - ".github/workflows/mutation-testing.yml"
      - "*.config.*"
      - "app/**"
      - "mutation-testing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/mutation-report.mjs"
      - "scripts/mutation-report.test.mjs"
      - "scripts/run-mutation-testing.mjs"
      - "server.js"
      - "server/**"
      - "stryker.config.mjs"
      - "tests/**"
      - "tsconfig*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mutation-testing.yml"
      - "*.config.*"
      - "app/**"
      - "mutation-testing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/mutation-report.mjs"
      - "scripts/mutation-report.test.mjs"
      - "scripts/run-mutation-testing.mjs"
      - "server.js"
      - "server/**"
      - "stryker.config.mjs"
      - "tests/**"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Require at least 94.8% and reject regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUTATION_SCORE_THRESHOLD: "94.8"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p reports/ci
      - run: |
          set -o pipefail
          pnpm mutation:policy 2>&1 | tee reports/ci/mutation-policy.log
      - run: |
          set -o pipefail
          pnpm mutation:test 2>&1 | tee reports/ci/mutation-testing.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report-${{ github.sha }}
          path: |
            reports/ci/mutation-policy.log
            reports/ci/mutation-testing.log
            reports/mutation/
          if-no-files-found: warn
          retention-days: 14
