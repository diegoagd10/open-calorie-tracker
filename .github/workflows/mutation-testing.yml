name: Mutation testing

on:
  pull_request:
    paths:
      - ".github/workflows/mutation-testing.yml"
      - "*.config.*"
      - "app/**"
      - "mutation-testing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/mutation-report.mjs"
      - "scripts/mutation-report.test.mjs"
      - "scripts/run-mutation-testing.mjs"
      - "scripts/run-mutation-testing.test.mjs"
      - "server.js"
      - "server/**"
      - "stryker.config.mjs"
      - "tests/**"
      - "tsconfig*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mutation-testing.yml"
      - "*.config.*"
      - "app/**"
      - "mutation-testing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/mutation-report.mjs"
      - "scripts/mutation-report.test.mjs"
      - "scripts/run-mutation-testing.mjs"
      - "scripts/run-mutation-testing.test.mjs"
      - "server.js"
      - "server/**"
      - "stryker.config.mjs"
      - "tests/**"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: Require at least 94.8% and reject regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUTATION_SCORE_THRESHOLD: "94.8"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v6
        id: mutation-cache
        with:
          path: |
            reports/stryker-incremental.json
            reports/stryker-context.txt
          key: ${{ runner.os }}-stryker-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-stryker-v1-
      - run: mkdir -p reports/ci
      - run: |
          set -o pipefail
          pnpm mutation:policy 2>&1 | tee reports/ci/mutation-policy.log
      - run: |
          set -o pipefail
          pnpm mutation:test 2>&1 | tee reports/ci/mutation-testing.log
      # A completed measurement is useful even when the score gate rejects it.
      # The runner removes the context marker before starting and only writes it
      # again after Stryker finishes, so interrupted runs are never saved.
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && hashFiles('reports/stryker-context.txt') != '' }}
        with:
          path: |
            reports/stryker-incremental.json
            reports/stryker-context.txt
          key: ${{ steps.mutation-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report-${{ github.sha }}
          path: |
            reports/ci/mutation-policy.log
            reports/ci/mutation-testing.log
            reports/stryker-incremental.json
            reports/stryker-context.txt
            reports/mutation/
          if-no-files-found: warn
          retention-days: 14
