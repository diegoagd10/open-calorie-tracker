name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test scripts/check-codeql-results.test.mjs
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          # This private personal repository is not eligible for GitHub code
          # scanning. Preserve the complete SARIF output as a workflow artifact.
          output: codeql-results
          upload: never
      - name: Reject CodeQL findings
        run: node scripts/check-codeql-results.mjs codeql-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-results
          if-no-files-found: warn
          retention-days: 14
