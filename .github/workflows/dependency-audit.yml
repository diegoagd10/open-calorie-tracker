name: Dependency audit

on:
  pull_request:
    paths:
      - ".github/dependency-audit-allowlist.json"
      - ".github/workflows/dependency-audit.yml"
      - ".npmrc"
      - "package.json"
      - "patches/**"
      - "pnpm-lock.yaml"
      - "pnpmfile.cjs"
      - "pnpm-workspace.yaml"
      - "scripts/audit-dependencies.mjs"
      - "scripts/audit-dependencies.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/dependency-audit-allowlist.json"
      - ".github/workflows/dependency-audit.yml"
      - ".npmrc"
      - "package.json"
      - "patches/**"
      - "pnpm-lock.yaml"
      - "pnpmfile.cjs"
      - "pnpm-workspace.yaml"
      - "scripts/audit-dependencies.mjs"
      - "scripts/audit-dependencies.test.mjs"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    name: Production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm audit:prod

  full:
    name: Full dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm audit:policy
      - run: pnpm audit:full
