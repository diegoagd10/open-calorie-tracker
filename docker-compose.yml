services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      FDC_API_KEY: "${FDC_API_KEY:-}"
      FDC_TIMEOUT_MS: "${FDC_TIMEOUT_MS:-5000}"
      PORT: "${PORT:-3000}"
    expose:
      - "${PORT:-3000}"
    volumes:
      - type: bind
        source: "${DATA_PATH:?Set DATA_PATH to the host data directory}"
        target: /app/data
