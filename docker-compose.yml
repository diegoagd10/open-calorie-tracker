services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      APPLICATION_URL: "${APPLICATION_URL:?Set the canonical HTTPS application origin}"
      FDC_API_KEY: "${FDC_API_KEY:-}"
      PHOTO_AI_PROVIDER: "${PHOTO_AI_PROVIDER:-openai-codex}"
      PHOTO_AI_MODEL: "${PHOTO_AI_MODEL:-gpt-5.6-luna}"
      PHOTO_AI_REASONING: "${PHOTO_AI_REASONING:-low}"
      PHOTO_AI_AUTH_PATH: "${PHOTO_AI_AUTH_PATH:-/app/data/pi/auth.json}"
      PHOTO_AI_USDA_ROUNDS: "${PHOTO_AI_USDA_ROUNDS:-3}"
      FDC_TIMEOUT_MS: "${FDC_TIMEOUT_MS:-5000}"
      OPEN_FOOD_FACTS_CONTACT_EMAIL: "${OPEN_FOOD_FACTS_CONTACT_EMAIL:-}"
      PORT: "${PORT:-3000}"
      TRUST_PROXY: "${TRUST_PROXY:?Set the private reverse-proxy network CIDR}"
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    volumes:
      - type: bind
        source: "${DATA_PATH:?Set DATA_PATH to the host data directory}"
        target: /app/data
