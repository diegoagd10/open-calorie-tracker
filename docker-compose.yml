services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      FDC_API_KEY: "${FDC_API_KEY:-}"
      FDC_TIMEOUT_MS: "${FDC_TIMEOUT_MS:-5000}"
      PORT: "${PORT:-3000}"
    expose:
      - "${PORT:-3000}"
    volumes:
      - application-data:/app/data

volumes:
  application-data:
    external: true
    name: "${DATA_VOLUME_NAME:-open-calory-tracker-data}"
