services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      APPLICATION_URL: "${APPLICATION_URL:?Set the canonical HTTPS application origin}"
      APPLICATION_SECRETS_PATH: "${APPLICATION_SECRETS_PATH:-/app/secrets}"
      APPLICATION_MASTER_KEY_PATH:
      PORT: "${PORT:-3000}"
      LAN_URL: "${LAN_URL:-}"
      LAN_PORT: "${LAN_PORT:-3002}"
    ports:
      - "127.0.0.1:${HOST_PORT:-3001}:${PORT:-3000}"
      - "${LAN_BIND_IP:-192.168.4.21}:${LAN_HOST_PORT:-3002}:${LAN_PORT:-3002}"
    volumes:
      - type: bind
        source: "${DATA_PATH:?Set DATA_PATH to the host data directory}"
        target: /app/data
      - type: bind
        source: "${APPLICATION_SECRETS_MOUNT_PATH:?Set APPLICATION_SECRETS_MOUNT_PATH to the separate host secrets directory}"
        target: "${APPLICATION_SECRETS_PATH:-/app/secrets}"
