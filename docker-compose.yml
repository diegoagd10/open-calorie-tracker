services:
  daily-intake:
    image: ${DAILY_INTAKE_IMAGE:-open-calory-tracker:latest}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DAILY_INTAKE_DB_PATH: /app/data/calories.db
    ports:
      - "${DAILY_INTAKE_PORT:-3000}:3000"
    volumes:
      - daily-intake-data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  daily-intake-data:
    name: ${DAILY_INTAKE_VOLUME:-open-calory-tracker-data}
